name: Weekly Kikaku Check Reminder

on:
  schedule:
    # 毎週月曜 09:00 JST (= 00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  create-reminder-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Get current date
        id: date
        run: echo "week=$(date -u -d '+9 hours' +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const week = '${{ steps.date.outputs.week }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📋 企画チェック週次リマインド (${week})`,
              body: `## 今週の企画チェックリマインド

            **対象期間**: ${week} 週

            ### やること

            - [ ] 先週の企画チェック依頼の振り返り（Slack #team-pp1u-企画相談）
            - [ ] 未対応の指摘コメントがないか確認（Confluence）
            - [ ] チェックリストの更新が必要な項目がないか確認
            - [ ] ダッシュボード数値の更新（月初の場合）

            ### 確認先

            - [企画チェックダッシュボード](https://matsushitayohei.github.io/kikaku-check/)
            - [チェックリスト](../checklist/v1.md)
            - Slack: #team-pp1u-企画相談

            ---
            *このIssueは GitHub Actions により自動作成されています*`,
              labels: ['reminder', 'weekly']
            });
